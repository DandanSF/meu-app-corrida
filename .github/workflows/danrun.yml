# Fábrica do DanRun: a cada mudança no código, o GitHub monta o app (.apk)
# e publica em "Releases" para baixar direto no celular.
name: Montar DanRun

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir a senha da assinatura
        env:
          DANRUN_KEYSTORE_PASSWORD: ${{ secrets.DANRUN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$DANRUN_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Senha DANRUN_KEYSTORE_PASSWORD não cadastrada: o APK sai com assinatura temporária."
          fi

      - name: Montar o APK
        env:
          DANRUN_KEYSTORE_PASSWORD: ${{ secrets.DANRUN_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDanrunRelease 2>&1 | tee build.log

      - name: Mostrar erros de montagem
        if: failure()
        run: |
          grep -E "error:|ERROR:|e: |What went wrong|Caused by|FAILED|AAPT" -A4 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp build/outputs/apk/danrun/release/*.apk saida/DanRun-1.0.${{ github.run_number }}.apk
          cp build/outputs/apk/danrun/release/*.apk saida/DanRun.apk
          ls -la saida

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: danrun-1.0.${{ github.run_number }}
          name: DanRun 1.0.${{ github.run_number }}
          body: |
            Para instalar: no celular, toque em **DanRun.apk** logo abaixo e depois em "Instalar".
          files: saida/*.apk
          make_latest: true
